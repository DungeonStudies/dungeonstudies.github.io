# Publish the game to GitHub Pages, which is what makes it installable: a
# service worker needs http(s), and opening the file off disk does not qualify.
#
# One setting is needed once, by hand: Settings -> Pages -> Source: GitHub
# Actions. After that every push to main redeploys, and an installed copy
# picks the new version up on its next launch with a connection.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          # index.html is the whole game, so it is also the landing page
          cp index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
